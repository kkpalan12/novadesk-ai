<app-ai-assistant></app-ai-assistant>

<app-command-palette
  [openDashboard]="openDashboard.bind(this)"
  [openProjects]="openProjects.bind(this)"
  [openWorkspace]="openWorkspace.bind(this)"
  [openProfile]="openProfile.bind(this)"
  [openAi]="openAiAssistant.bind(this)"
></app-command-palette>
<div class="app-shell">
  <app-confirm-dialog></app-confirm-dialog>

  <!-- =========================
       SIDEBAR
       ========================= -->

  <aside class="sidebar">
    <!-- BRAND -->

    <div class="brand">
      <img src="novadesk-ai-icon.png" alt="NovaDesk AI" class="brand-logo" />

      <div class="brand-details">
        <span class="brand-name"> NovaDesk AI </span>

        <span class="brand-subtitle"> Enterprise Workspace </span>
      </div>
    </div>

    <!-- WORKSPACE CARD -->

    <div class="workspace-card">
      <span class="section-label"> WORKSPACE </span>

      <select
        id="workspace"
        class="workspace-select"
        [value]="workspaceContext.activeWorkspace()?._id ?? ''"
        (change)="selectWorkspace($any($event.target).value)"
        [disabled]="workspaceContext.loading()"
      >
        @if (workspaceContext.loading()) {
          <option value="">Loading...</option>
        } @else {
          @for (
            workspace of workspaceContext.workspaces();
            track workspace._id
          ) {
            <option [value]="workspace._id">
              {{ workspace.name }}
            </option>
          }
        }
      </select>

      @if (workspaceContext.errorMessage()) {
        <div class="workspace-error">
          {{ workspaceContext.errorMessage() }}

          <button type="button" (click)="retryWorkspaces()">Retry</button>
        </div>
      }
    </div>

    <!-- NAVIGATION -->

    <nav class="navigation">
      <span class="nav-section"> PRODUCTIVITY </span>

      <button
        class="nav-item"
        [class.active]="isActiveRoute('/dashboard')"
        (click)="goToDashboard()"
      >
        <lucide-icon class="nav-icon" [img]="icons.dashboard" size="20">
        </lucide-icon>
        <span> Dashboard </span>
      </button>

      <button
        class="nav-item"
        [class.active]="isActiveRoute('/projects')"
        (click)="goToProjects()"
      >
        <lucide-icon class="nav-icon" [img]="icons.projects" size="20">
        </lucide-icon>
        <span> Projects </span>
      </button>

      <button
        class="nav-item"
        [class.active]="isActiveRoute('/workspace')"
        (click)="goToWorkspace()"
      >
        <lucide-icon class="nav-icon" [img]="icons.workspace" size="20">
        </lucide-icon>
        <span> Workspace </span>
      </button>

      <button
        class="nav-item"
        [class.active]="isActiveRoute('/notifications')"
        (click)="goToNotifications()"
      >
        <lucide-icon class="nav-icon" [img]="icons.notifications" size="20">
        </lucide-icon>
        <span> Notifications </span>

        @if (unreadNotificationCount() > 0) {
          <span class="notification-badge">
            {{
              unreadNotificationCount() > 99 ? "99+" : unreadNotificationCount()
            }}
          </span>
        }
      </button>

      <span class="nav-section ai-section"> INTELLIGENCE </span>

      <button type="button" class="nav-item" (click)="openAiAssistant()">
        <span class="nav-icon"> ✦ </span>

        <span> AI Assistant </span>
      </button>

      <!--  <button type="button" class="nav-item">
        <span class="nav-icon"> ◌ </span>

        <span> Analytics </span>
      </button> -->
    </nav>

    <!-- USER AREA -->

    <div class="sidebar-footer">
      <button type="button" class="profile-card" (click)="goToProfile()">
        <span class="profile-avatar">
          {{ userInitial }}
        </span>

        <span class="profile-details">
          <strong>
            {{ user?.firstName }}
          </strong>
        </span>
      </button>

      <button type="button" class="logout-button" (click)="logout()">
        <lucide-icon [img]="icons.logout" size="18"> </lucide-icon>
        Sign out
      </button>
    </div>
  </aside>
  <!-- =========================
       MAIN AREA
       ========================= -->

  <main class="main-area">
    <!-- TOPBAR -->

    <header class="topbar">
      <div class="topbar-left">
        <div class="page-title">NovaDesk AI</div>

        <div class="global-search">
          <span> ⌕ </span>

          <input type="text" placeholder="Search projects, tasks..." />

          <kbd> ⌘ K </kbd>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="topbar-actions">
        <!-- AI ASSISTANT -->

        <button
          type="button"
          class="ai-button"
          (click)="openAiAssistant()"
          aria-label="Open NovaDesk AI"
        >
          <lucide-icon [img]="icons.ai" size="20"> </lucide-icon>
        </button>

        <!-- NOTIFICATIONS -->

        <button
          type="button"
          class="notification-button"
          (click)="goToNotifications()"
        >
          <lucide-icon [img]="icons.notifications" size="20"> </lucide-icon>
        </button>

        <!-- PROFILE -->

        <button type="button" class="user-avatar" (click)="goToProfile()">
          {{ userInitial }}
        </button>
      </div>
    </header>

    <!-- MOBILE WORKSPACE -->

    <div class="mobile-workspace-selector">
      <label> WORKSPACE </label>

      <select
        [value]="workspaceContext.activeWorkspace()?._id ?? ''"
        (change)="selectWorkspace($any($event.target).value)"
        [disabled]="workspaceContext.loading()"
      >
        @for (workspace of workspaceContext.workspaces(); track workspace._id) {
          <option [value]="workspace._id">
            {{ workspace.name }}
          </option>
        }
      </select>
    </div>

    <!-- PAGE -->

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
  <!-- =========================
       MOBILE NAVIGATION
       ========================= -->

  <nav class="mobile-navigation">
    <button
      type="button"
      class="mobile-nav-item"
      (click)="goToDashboard()"
      [class.active]="isActiveRoute('/dashboard')"
    >
      <lucide-icon class="mobile-nav-icon" [img]="icons.dashboard" size="20">
      </lucide-icon>
      <span> Home </span>
    </button>

    <button
      type="button"
      class="mobile-nav-item"
      (click)="goToProjects()"
      [class.active]="isActiveRoute('/projects')"
    >
      <lucide-icon class="mobile-nav-icon" [img]="icons.projects" size="20">
      </lucide-icon>
      <span> Projects </span>
    </button>

    <button
      type="button"
      class="mobile-nav-item mobile-primary"
      (click)="goToWorkspace()"
      [class.active]="isActiveRoute('/workspace')"
    >
      <span class="primary-action">
        <lucide-icon [img]="icons.workspace" size="22"> </lucide-icon>
      </span>
      <span> Create </span>
    </button>

    <button
      type="button"
      class="mobile-nav-item"
      (click)="goToNotifications()"
      [class.active]="isActiveRoute('/notifications')"
    >
      <lucide-icon
        class="mobile-nav-icon"
        [img]="icons.notifications"
        size="20"
      >
        @if (unreadNotificationCount() > 0) {
          <span class="mobile-notification-badge">
            {{
              unreadNotificationCount() > 99 ? "99+" : unreadNotificationCount()
            }}
          </span>
        }
      </lucide-icon>
      <span> Alerts </span>
    </button>

    <button
      type="button"
      class="mobile-nav-item"
      (click)="goToProfile()"
      [class.active]="isActiveRoute('/settings/profile')"
    >
      <span class="mobile-profile-avatar">
        {{ userInitial }}
      </span>

      <span> Profile </span>
    </button>
  </nav>
</div>
