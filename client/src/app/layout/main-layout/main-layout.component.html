<div class="app-shell">

    <!-- =========================================
       SIDEBAR
       ========================================= -->

    <aside class="sidebar">

        <!-- BRAND -->

        <div class="brand">

            <img src="novadesk-ai-icon.png" alt="NovaDesk AI" class="brand-logo" />

            <span class="brand-name">
                NovaDesk
            </span>

        </div>


        <!-- =======================================
         WORKSPACE SELECTOR
         ======================================= -->

        <div class="workspace-selector">

            <label for="workspace" class="workspace-label">
                WORKSPACE
            </label>

            <select id="workspace" class="workspace-select" [value]="workspaceContext.activeWorkspace()?._id ?? ''"
                (change)="selectWorkspace($any($event.target).value)" [disabled]="workspaceContext.loading()">

                @if (workspaceContext.loading()) {

                <option value="">
                    Loading...
                </option>

                }

                @else if (
                workspaceContext.workspaces().length === 0
                ) {

                <option value="">
                    No workspaces
                </option>

                }

                @else {

                @for (
                workspace of workspaceContext.workspaces();
                track workspace._id
                ) {

                <option [value]="workspace._id">
                    {{ workspace.name }}
                </option>

                }

                }

            </select>


            <!-- Workspace Error -->

            @if (workspaceContext.errorMessage()) {

            <div class="workspace-error">
                {{ workspaceContext.errorMessage() }}
            </div>

            }

        </div>


        <!-- =======================================
         DESKTOP NAVIGATION
         ======================================= -->

        <nav class="navigation">

            <button type="button" class="nav-item" (click)="goToDashboard()">
                <span class="nav-icon">
                    ⌂
                </span>

                <span>
                    Dashboard
                </span>
            </button>


            <button type="button" class="nav-item" (click)="goToProjects()">
                <span class="nav-icon">
                    ▣
                </span>

                <span>
                    Projects
                </span>
            </button>


            <!-- WORKSPACE -->

            <button type="button" class="nav-item" (click)="goToWorkspace()">
                <span class="nav-icon">
                    ◫
                </span>

                <span>
                    Workspace
                </span>
            </button>


            <!-- NOTIFICATIONS -->

            <button type="button" class="nav-item" (click)="goToNotifications()">

                <span class="nav-icon">
                    ♢
                </span>

                <span>
                    Notifications
                </span>

                @if (unreadNotificationCount() > 0) {

                <span class="notification-badge">

                    {{
                    unreadNotificationCount() > 99
                    ? '99+'
                    : unreadNotificationCount()
                    }}

                </span>

                }

            </button>

        </nav>


        <!-- =======================================
         SIDEBAR BOTTOM
         ======================================= -->

        <div class="sidebar-bottom">

            <button type="button" class="nav-item logout-button" (click)="logout()">

                <span class="nav-icon">
                    ↪
                </span>

                <span>
                    Logout
                </span>

            </button>

        </div>

    </aside>


    <!-- =========================================
       MAIN AREA
       ========================================= -->

    <main class="main-area">

        <!-- =======================================
         TOPBAR
         ======================================= -->

        <header class="topbar">

            <div class="topbar-title">
                NovaDesk AI
            </div>


            <!-- ===================================
             MOBILE WORKSPACE SELECTOR
             =================================== -->

            <div class="mobile-workspace-selector">

                <label for="mobile-workspace">
                    WORKSPACE
                </label>

                <select id="mobile-workspace" [value]="workspaceContext.activeWorkspace()?._id ?? ''"
                    (change)="selectWorkspace($any($event.target).value)" [disabled]="workspaceContext.loading()">

                    @if (workspaceContext.loading()) {

                    <option value="">
                        Loading...
                    </option>

                    }

                    @else if (
                    workspaceContext.workspaces().length === 0
                    ) {

                    <option value="">
                        No workspaces
                    </option>

                    }

                    @else {

                    @for (
                    workspace of workspaceContext.workspaces();
                    track workspace._id
                    ) {

                    <option [value]="workspace._id">
                        {{ workspace.name }}
                    </option>

                    }

                    }

                </select>

            </div>


            <!-- ===================================
             TOPBAR ACTIONS
             =================================== -->

            <div class="topbar-actions">

                <!-- Notifications -->

                <button type="button" class="notification-button" (click)="goToNotifications()"
                    aria-label="Notifications">

                    ♢

                    @if (unreadNotificationCount() > 0) {

                    <span class="notification-badge notification-badge-top">

                        {{
                        unreadNotificationCount() > 99
                        ? '99+'
                        : unreadNotificationCount()
                        }}

                    </span>

                    }

                </button>


                <!-- User -->

                <button type="button" class="user-avatar" [attr.aria-label]="
                        user
                            ? 'Open profile for ' + user.firstName
                            : 'Open profile'
                    " [title]="
                        user
                            ? user.firstName + ' ' + user.lastName
                            : 'Profile'
                    " (click)="goToProfile()">
                    {{ userInitial }}
                </button>

            </div>

        </header>


        <!-- =======================================
         ROUTED PAGE
         ======================================= -->

        <section class="page-content">

            <router-outlet></router-outlet>

        </section>

    </main>


    <!-- =========================================
       MOBILE BOTTOM NAVIGATION
       ========================================= -->

    <nav class="mobile-navigation">

        <!-- Dashboard -->

        <button type="button" class="mobile-nav-item" (click)="goToDashboard()">

            <span class="mobile-nav-icon">
                ⌂
            </span>

            <span>
                Dashboard
            </span>

        </button>


        <!-- Projects -->

        <button type="button" class="mobile-nav-item" (click)="goToProjects()">

            <span class="mobile-nav-icon">
                ▣
            </span>

            <span>
                Projects
            </span>

        </button>


        <!-- Workspace -->

        <button type="button" class="mobile-nav-item" (click)="goToWorkspace()">

            <span class="mobile-nav-icon">
                ◫
            </span>

            <span>
                Workspace
            </span>

        </button>


        <!-- Notifications -->

        <button type="button" class="mobile-nav-item" (click)="goToNotifications()">

            <span class="mobile-nav-icon">

                ♢

                @if (unreadNotificationCount() > 0) {

                <span class="mobile-notification-badge">

                    {{
                    unreadNotificationCount() > 99
                    ? '99+'
                    : unreadNotificationCount()
                    }}

                </span>

                }

            </span>

            <span>
                Notifications
            </span>

        </button>

    </nav>

</div>
