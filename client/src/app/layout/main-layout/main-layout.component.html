<div class="app-shell">

    <!-- =========================================
       SIDEBAR
       ========================================= -->

    <aside class="sidebar">

        <!-- Brand -->

        <div class="brand">

            <div class="brand-icon">
                N
            </div>

            <div class="brand-name">
                NovaDesk
            </div>

        </div>


        <!-- =======================================
         WORKSPACE SELECTOR
         ======================================= -->

        <div class="workspace-selector">

            <label for="workspace" class="workspace-label">
                WORKSPACE
            </label>

            <select id="workspace" class="workspace-select" [value]="
          workspaceContext.activeWorkspace()?._id ?? ''
        " (change)="
          selectWorkspace(
            $any($event.target).value
          )
        " [disabled]="workspaceContext.loading()">

                @if (workspaceContext.loading()) {

                <option value="">
                    Loading...
                </option>

                }

                @else if (
                workspaceContext.workspaces().length === 0
                ) {

                <option value="">
                    No workspaces
                </option>

                }

                @else {

                @for (
                workspace of workspaceContext.workspaces();
                track workspace._id
                ) {

                <option [value]="workspace._id">
                    {{ workspace.name }}
                </option>

                }

                }

            </select>


            <!-- Workspace Error -->

            @if (workspaceContext.errorMessage()) {

            <div class="workspace-error">
                {{ workspaceContext.errorMessage() }}
            </div>

            }

        </div>


        <!-- =======================================
         NAVIGATION
         ======================================= -->

    <nav class="navigation">
    
        <button type="button" class="nav-item" (click)="goToDashboard()">
            <span class="nav-icon">⌂</span>
            <span>Dashboard</span>
        </button>
    
    
        <button type="button" class="nav-item" (click)="goToProjects()">
            <span class="nav-icon">▣</span>
            <span>Projects</span>
        </button>
    
    
        <!-- WORKSPACE -->
<button type="button" class="nav-item" (click)="goToWorkspace()">
    <span class="nav-icon">◫</span>
    <span>Workspace</span>
</button>
    
    
<button type="button" class="nav-item" (click)="goToNotifications()">
    <span class="nav-icon">♢</span>

    <span>Notifications</span>

    @if (unreadNotificationCount() > 0) {
    <span class="notification-badge">
        {{
        unreadNotificationCount() > 99
        ? '99+'
        : unreadNotificationCount()
        }}
    </span>
    }
</button>
    
    </nav>


        <!-- =======================================
         SIDEBAR BOTTOM
         ======================================= -->

        <div class="sidebar-bottom">

            <button type="button" class="nav-item logout-button" (click)="logout()">

                <span class="nav-icon">
                    ↪
                </span>

                <span>
                    Logout
                </span>

            </button>

        </div>

    </aside>


    <!-- =========================================
       MAIN AREA
       ========================================= -->

    <main class="main-area">

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="topbar-title">
                NovaDesk AI
            </div>


            <div class="topbar-actions">

                <!-- Notifications -->

            <button type="button" class="notification-button" (click)="goToNotifications()" aria-label="Notifications">
                ♢
            
                @if (unreadNotificationCount() > 0) {
                <span class="notification-badge notification-badge-top">
                    {{
                    unreadNotificationCount() > 99
                    ? '99+'
                    : unreadNotificationCount()
                    }}
                </span>
                }
            </button>


                <!-- User -->
<div class="user-avatar" [attr.aria-label]="
    user
      ? 'Current user: ' + user.firstName
      : 'Current user'
  " [title]="
    user
      ? user.firstName + ' ' + user.lastName
      : ''
  ">
    {{ userInitial }}
</div>
            </div>

        </header>


        <!-- =======================================
         ROUTED PAGE
         ======================================= -->

        <section class="page-content">

            <router-outlet></router-outlet>

        </section>

    </main>

</div>
